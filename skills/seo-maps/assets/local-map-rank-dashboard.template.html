<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Map Rank Dashboard: Aristral template</title>
<!--
  ARISTRAL · Local Map Rank Dashboard (reusable template)
  =======================================================
  To make a dashboard for a new client: copy this file, then edit ONLY the
  CLIENT = {...} block near the top of the <script> at the bottom. Everything
  else (layout, styling, KPI maths) is generic and recomputes automatically.

  Grid data comes from a /seo-maps geo-grid scan. Rank keys are "row-col"
  (0-indexed, rows run North->South, cols run West->East). Omit a cell = the
  business is not in the top 20 at that point. KPIs (avg rank, share of voice,
  coverage, distribution) are computed from the grid. You don't hand-calc them.

  See README.md in this folder for the full field guide.
-->
<style>
:root{
  --tp:#16161d;--ts:#5a5a66;--tt:#8a8a96;
  --bg:#ffffff;--bg2:#f4f5f7;--bd:rgba(0,0,0,.10);--bd2:rgba(0,0,0,.18);
  --r:8px;--rl:12px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tp);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6}
.wrap{max-width:1000px;margin:0 auto;padding:28px 22px 40px}
.mut{font-size:13px;color:var(--ts)}
.sec{font-size:14px;font-weight:500;color:var(--tp);margin:1.7rem 0 .6rem}
h1{font-size:22px;font-weight:500;margin:0}
.head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.acc{width:7px;height:36px;border-radius:3px;background:#e24b4a}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:1.1rem 0}
.kpi{background:var(--bg2);border-radius:var(--r);padding:.9rem 1rem}
.kpi .l{font-size:13px;color:var(--ts)}
.kpi .v{font-size:26px;font-weight:500;margin-top:3px;line-height:1.1}
.kpi .s{font-size:11px;color:var(--tt);margin-top:3px}
.row{display:flex;align-items:center;justify-content:space-between;padding:9px 2px;border-bottom:.5px solid var(--bd)}
.row .n{font-size:14px}
.badge{min-width:38px;height:28px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;padding:0 9px}
.cell{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500}
.area{font-size:11px;color:var(--tt);width:90px;text-align:right;padding-right:10px;white-space:nowrap}
.leg{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ts)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.note{margin-top:1.4rem;font-size:11px;color:var(--ts);line-height:1.7;border-top:.5px solid var(--bd);padding-top:12px}
.cols{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:760px){.cols{grid-template-columns:1fr 1fr;gap:28px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><div class="acc" id="acc"></div><div><h1 id="brand"></h1><div class="mut" id="meta"></div></div></div>
  <div class="kpis" id="kpis"></div>
  <div class="cols">
    <div>
      <div class="sec" id="kw-h"></div>
      <div id="kw"></div>
      <div class="sec">Who outranks them · best observed position</div>
      <div id="comp"></div>
    </div>
    <div>
      <div class="sec" id="grid-h"></div>
      <div id="grid" style="overflow-x:auto"></div>
      <div id="legend" style="display:flex;flex-wrap:wrap;gap:14px;margin-top:12px"></div>
    </div>
  </div>
  <div class="note" id="note"></div>
</div>
<script>
/* ============================ EDIT THIS BLOCK ONLY ============================ */
var CLIENT = {
  brand: "Nata Beauty",
  heroKeyword: "powder brows bristol",
  snapshotDate: "02 Jun 2026",
  centre: "10 Chandos Rd, Redland BS6 6PE",
  gridSpanKm: 12,
  accent: "#e24b4a",
  gridSize: 9,                 /* N x N grid */
  centreKey: "4-4",            /* "row-col" of the business location (0-indexed) */
  /* row labels, North -> South (length must equal gridSize) */
  areas: ["Filton","Henleaze","Bishopston","Westbury Pk","Redland ●","Clifton","Bedminster","Knowle","Hartcliffe"],
  /* geo-grid ranks: "row-col": rank. Omit a cell = not in top 20 there. */
  grid: {
    "2-4":20,
    "3-3":18,"3-4":16,"3-5":17,
    "4-2":18,"4-3":15,"4-4":14,"4-5":16,
    "5-3":17,"5-4":18
  },
  /* at-business rank per keyword. rank:null = 20+. delta: "+1" / "-2" / "new" / "flat" / "" */
  keywords: [
    {name:"permanent makeup bristol", rank:12, delta:"+1"},
    {name:"powder brows bristol",     rank:14, delta:"-2"},
    {name:"lip blush bristol",        rank:16, delta:"new"},
    {name:"lash lift bristol",        rank:17, delta:"-1"},
    {name:"microblading bristol",     rank:null, delta:"flat"}
  ],
  competitors: [
    {name:"Ella May Permanent Makeup", rank:1},
    {name:"Glow Up Studio Bristol",    rank:1},
    {name:"Defined by Linda",          rank:2},
    {name:"Tasha B Brows",             rank:2},
    {name:"The Clifton Suite",         rank:3},
    {name:"Max's Brows",               rank:4},
    {name:"MYSTIC Beauty & Brow Bar",  rank:8}
  ],
  tiers: [3,10,15,20],         /* upper bounds: 1-3, 4-10, 11-15, 16-20 */
  source: "Source: /seo-maps via Google Places API (own-coordinate searches + geo-grid). Point-in-time snapshot, not a live tracker. Competitor positions are best observed rank across keyword searches, not a full grid average."
};
/* ========================== END EDIT BLOCK ================================== */

(function(){
  var C=CLIENT, T=C.tiers||[3,10,15,20];
  function col(r){if(r==null)return null;if(r<=T[0])return["#1f9d55","#fff"];if(r<=T[1])return["#d69e2e","#3d2c00"];if(r<=T[2])return["#dd6b20","#fff"];if(r<=T[3])return["#e24b4a","#fff"];return null;}
  function el(t){return document.createElement(t);}
  document.getElementById("acc").style.background=C.accent||"#e24b4a";
  document.getElementById("brand").textContent=C.brand+": local map rank";
  document.getElementById("meta").textContent="Hero keyword: "+C.heroKeyword+" · geo-grid snapshot "+C.snapshotDate+" · centre = "+C.centre;
  document.getElementById("kw-h").textContent="Rank by keyword · at the business ("+C.snapshotDate+")";
  document.getElementById("grid-h").textContent="Geo-grid · "+C.gridSpanKm+" km × "+C.gridSpanKm+" km · "+C.heroKeyword;
  document.title=C.brand+": Local Map Rank Dashboard";

  var ranked=Object.values(C.grid).filter(function(v){return v!=null;});
  var total=C.gridSize*C.gridSize;
  var sum=ranked.reduce(function(a,b){return a+b;},0);
  var avg=ranked.length?(sum/ranked.length).toFixed(1):"–";
  var best=ranked.length?Math.min.apply(null,ranked):"–";
  var top3=ranked.filter(function(r){return r<=T[0];}).length;
  var poor=ranked.filter(function(r){return r>T[1]&&r<=T[3];}).length;
  var out=total-ranked.length;
  var pct=function(n){return Math.round(n/total*100)+"%";};
  var kpis=[
    {l:"Avg rank",v:avg,s:"where ranked ("+ranked.length+" pts)"},
    {l:"Share of voice",v:pct(top3),s:"top-"+T[0]+" presence"},
    {l:"Best rank",v:ranked.length?("#"+best):"–",s:"best grid point"},
    {l:"Grid coverage",v:pct(ranked.length),s:ranked.length+" of "+total+" points"},
    {l:"Ranks "+(T[1]+1)+"–"+T[3],v:pct(poor),s:"poor tier"},
    {l:"Out of top "+T[3],v:pct(out),s:out+" of "+total+" points"}
  ];
  var kc=document.getElementById("kpis");
  kpis.forEach(function(k){var d=el("div");d.className="kpi";d.innerHTML='<div class="l"></div><div class="v"></div><div class="s"></div>';d.children[0].textContent=k.l;d.children[1].textContent=k.v;d.children[2].textContent=k.s;kc.appendChild(d);});

  var g=document.getElementById("grid");
  for(var r=0;r<C.gridSize;r++){
    var row=el("div");row.style.display="flex";row.style.alignItems="center";row.style.gap="5px";row.style.marginBottom="5px";
    var lab=el("div");lab.className="area";lab.textContent=(C.areas&&C.areas[r])||("row "+r);row.appendChild(lab);
    for(var c=0;c<C.gridSize;c++){
      var k=r+"-"+c,rk=C.grid[k],cc=col(rk),cell=el("div");cell.className="cell";
      if(cc){cell.style.background=cc[0];cell.style.color=cc[1];cell.textContent=rk;}
      else{cell.style.background="var(--bg2)";cell.style.border=".5px solid var(--bd)";}
      if(k===C.centreKey){cell.style.outline="2px solid var(--tp)";cell.style.outlineOffset="1px";}
      row.appendChild(cell);
    }
    g.appendChild(row);
  }

  var legend=[["#1f9d55","1–"+T[0]],["#d69e2e",(T[0]+1)+"–"+T[1]],["#dd6b20",(T[1]+1)+"–"+T[2]],["#e24b4a",(T[2]+1)+"–"+T[3]]];
  var lg=document.getElementById("legend");
  legend.forEach(function(x){var s=el("span");s.className="leg";s.innerHTML='<span class="dot" style="background:'+x[0]+'"></span>'+x[1];lg.appendChild(s);});
  var o=el("span");o.className="leg";o.innerHTML='<span class="dot" style="background:var(--bg2);border:.5px solid var(--bd2)"></span>not in top '+T[3];lg.appendChild(o);
  var you=el("span");you.className="leg";you.innerHTML='<span style="width:12px;height:12px;border-radius:50%;border:2px solid var(--tp);display:inline-block"></span>'+C.brand+" (you)";lg.appendChild(you);

  var kw=document.getElementById("kw");
  C.keywords.forEach(function(x){
    var cc=col(x.rank),row=el("div");row.className="row";
    var left=el("div");left.className="n";left.textContent=x.name;
    var right=el("div");right.style.display="flex";right.style.alignItems="center";right.style.gap="9px";
    var dl=el("span");dl.style.fontSize="11px";dl.style.color="var(--tt)";
    dl.textContent=!x.delta?"":(x.delta==="new"?"new":(x.delta==="flat"?"flat":(x.delta.charAt(0)==="+"?"▲ "+x.delta:"▼ "+x.delta)));
    var b=el("span");b.className="badge";
    if(cc){b.style.background=cc[0];b.style.color=cc[1];b.textContent="#"+x.rank;}
    else{b.style.background="var(--bg2)";b.style.color="var(--ts)";b.style.border=".5px solid var(--bd)";b.textContent=T[3]+"+";}
    right.appendChild(dl);right.appendChild(b);row.appendChild(left);row.appendChild(right);kw.appendChild(row);
  });

  var cp=document.getElementById("comp");
  (C.competitors||[]).forEach(function(x){
    var cc=col(x.rank)||["#5f5e5a","#fff"],row=el("div");row.className="row";
    var left=el("div");left.className="n";left.textContent=x.name;
    var b=el("span");b.className="badge";b.style.background=cc[0];b.style.color=cc[1];b.textContent="#"+x.rank;
    row.appendChild(left);row.appendChild(b);cp.appendChild(row);
  });

  document.getElementById("note").textContent=C.source||"";
})();
</script>
</body>
</html>
